<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Shared "Aperture" language with obsbot-control: same ground gradient, squircle plate,
         turned bezel, and brass/amber palette. Here the hero is a radiant GLOW (the light) instead
         of a camera iris, so the two icons read as a matched camera + light set. -->

    <!-- ground gradient for the squircle plate -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23201b"/>
      <stop offset="100%" stop-color="#191612"/>
    </linearGradient>

    <!-- subtle radial inner glow, centered (warmer here — the whole plate is lit by the glow) -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e6b569" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b9762e" stop-opacity="0"/>
    </radialGradient>

    <!-- top inner highlight -->
    <linearGradient id="topHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6ecdb" stop-opacity="0.08"/>
      <stop offset="12%" stop-color="#f6ecdb" stop-opacity="0"/>
    </linearGradient>

    <!-- ray metal gradient: bright cream near the tip, through amber, to brass at the base -->
    <linearGradient id="rayGrad" gradientUnits="userSpaceOnUse" x1="0" y1="-372" x2="0" y2="-118">
      <stop offset="0%" stop-color="#ffe6ac"/>
      <stop offset="42%" stop-color="#e6b569"/>
      <stop offset="100%" stop-color="#b9762e"/>
    </linearGradient>

    <!-- warm halo that spills behind the rays -->
    <radialGradient id="glowSpill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6b569" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#e6b569" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e6b569" stop-opacity="0"/>
    </radialGradient>

    <!-- luminous core glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e6" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f6ecdb" stop-opacity="0.9"/>
      <stop offset="72%" stop-color="#e6b569" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e6b569" stop-opacity="0"/>
    </radialGradient>

    <!-- drop shadow for the whole plate -->
    <filter id="plateShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="softBlurWide" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- one tapered ray, tip up (r=372) to base near the core (r=118), rounded tip -->
    <path id="rayShape" d="M 0,-372 L 13,-124 A 13,13 0 0 1 -13,-124 Z"/>

    <clipPath id="plateClip">
      <rect x="87" y="87" width="850" height="850" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- ============ PLATE (squircle, ~83% of canvas, centered) ============ -->
  <g filter="url(#plateShadow)">
    <rect x="87" y="87" width="850" height="850" rx="230" ry="230" fill="url(#ground)"/>
  </g>
  <rect x="87" y="87" width="850" height="850" rx="230" ry="230" fill="url(#innerGlow)"/>
  <rect x="87" y="87" width="850" height="850" rx="230" ry="230" fill="url(#topHighlight)"/>

  <!-- ============ GLOW GROUP (centered at 512,512) ============ -->
  <!-- outer clip (canvas coords) keeps the wide halo inside the plate's rounded corners -->
  <g clip-path="url(#plateClip)">
  <g transform="translate(512,512)">

    <!-- turned bezel: dark base ring + top-left highlight arc + bottom-right shadow arc,
         identical treatment to the aperture icon so the rim reads machined, not flat -->
    <circle r="420" fill="none" stroke="#3a332a" stroke-width="15"/>
    <circle r="420" fill="none" stroke="#191612" stroke-width="3" stroke-dasharray="659 659" stroke-dashoffset="-165" opacity="0.8"/>
    <circle r="420" fill="none" stroke="#e6b569" stroke-width="2.4" stroke-dasharray="659 659" stroke-dashoffset="495" opacity="0.55"/>
    <circle r="413" fill="none" stroke="#191612" stroke-width="2" opacity="0.5"/>

    <!-- wide warm halo behind everything -->
    <circle r="300" fill="url(#glowSpill)" filter="url(#softBlurWide)"/>

    <!-- twelve rays every 30deg: a soft blurred pass for glow, then the crisp metal pass on top -->
    <g opacity="0.55" filter="url(#softBlur)">
      <use href="#rayShape" transform="rotate(0)"   fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(30)"  fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(60)"  fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(90)"  fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(120)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(150)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(180)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(210)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(240)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(270)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(300)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(330)" fill="url(#rayGrad)"/>
    </g>
    <g>
      <use href="#rayShape" transform="rotate(0)"   fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(30)"  fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(60)"  fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(90)"  fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(120)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(150)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(180)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(210)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(240)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(270)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(300)" fill="url(#rayGrad)"/>
      <use href="#rayShape" transform="rotate(330)" fill="url(#rayGrad)"/>
    </g>

    <!-- luminous core: soft glow, then a bright cream disc with a fine amber rim -->
    <circle r="150" fill="url(#coreGlow)" filter="url(#softBlur)"/>
    <circle r="92" fill="url(#coreGlow)"/>
    <circle r="70" fill="#fff8ee"/>
    <circle r="70" fill="none" stroke="#e6b569" stroke-width="3" opacity="0.7"/>

    <!-- soft top-left sheen across the core, kept low like the aperture icon -->
    <radialGradient id="lightSource" cx="-120" cy="-140" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6ecdb" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#f6ecdb" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#f6ecdb" stop-opacity="0"/>
    </radialGradient>
    <circle r="150" fill="url(#lightSource)"/>
  </g>
  </g>
</svg>
